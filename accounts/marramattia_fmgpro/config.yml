# ---------------------------------------------------------------------------
# Source Limits (per singolo blogger, dentro una sessione)
# ---------------------------------------------------------------------------
interactions-count: 35-50                  # [yield-tune+] alzato 20-30 -> 35-50: con sorgenti gia' battute (50% utenti = "already interacted, skip"), servono piu' tentativi per estrarre 5-9 follow utili. Il vero freno resta total-successful-interactions-limit (sessione).
likes-count: 2                             # 2 like per profilo (ridotto: meno chance di beccare Reel buggati)
likes-percentage: 85-95                    # quasi sempre likka, mai 100% (anti-pattern)
carousel-count: 1-2
carousel-percentage: 30-50                 # [v2] abbassato da 50-70 a 30-50: log mostra 25-67 "Fail to like post"/giorno (178 totali in 4gg), causa probabile = doppio-tap su carosello che cambia slide invece di likare. Meno caroselli = meno fail.
max-comments-pro-user: 1                   # max 1 commento per utente (anti-ban: mai 2 sullo stesso post)
comment-percentage: 45-60                  # [safety #1] ridotto da 55-70: i commenti sono l'azione piu' a rischio ban. Margine di sicurezza, facilmente reversibile se vuoi ripingere.
pm-percentage: 0                           # [DISABILITATO] DM completamente off su main (i DM sono gestiti solo nel branch personalcoaching tramite il plugin custom dm-followback)
interact-percentage: 70-85
follow-percentage: 50-65                   # ~55% di chi interagisce -> ~7-9 follow/sorgente
follow-limit: 10-15                        # [soft-floor] alzato da 8-12: cosi' il cap per-sorgente non diventa il bottleneck quando una sorgente e' "calda" e la sessione e' ancora sotto il target follow
skipped-list-limit: 50-70                  # [bumped] 50-70 (era 30-45): meno chiusure premature di sorgente per "Same users iterated 2 times". Scrolla piu' a lungo nella zona "calda" prima di abbandonare.
skipped-posts-limit: 4
fling-when-skipped: 0
min-following: 50

# ---------------------------------------------------------------------------
# Total Limits Per Session - 5 sessioni/giorno (micro-sessioni)
# Totali giornalieri target:
#   follow:   5 x 13   = 65/g          (tabella: 60-70)              ✅
#   like:     5 x 27   = 135/g         (tabella: 120-150)            ✅
#   comment:  5 x 13   = 65-75/g       (tabella: 150-200, half-tank) ✅
# Rate orario sessione (~90 min):
#   follow:  ~8-9 follow/h             (max prudente: 8-10/h)        ✅
#   like:    ~18 like/h                (max prudente: 15-20/h)       ✅
#   comment: ~10-13 comment/h          (tabella: 10-15/h, al limite) ✅
# ---------------------------------------------------------------------------
total-likes-limit: 24-30                   # 24-30 like/sessione
total-follows-limit: 11-15                 # 11-15 follow/sessione
total-unfollows-limit: 999                 # [cosmetic] 0-0 produceva "Limit Reached" nei log; 999 = il bot non unfollowera' mai perche' non c'e' un job action-unfollow attivo. Solo cosmetica.
total-watches-limit: 999                   # [cosmetic] 0-0 produceva "Limit Reached" nei log; 999 = stories OFF garantito da stories-count: 0 + stories-percentage: 0 sotto. Solo cosmetica.
total-successful-interactions-limit: 11-15
total-interactions-limit: 999              # IRRILEVANTE: questo conta solo i profili VISITATI (anche skippati). Il vero limite anti-ban e' total-successful-interactions-limit.
total-comments-limit: 9-12                 # [safety #1] ridotto da 12-15: ~7-10/h, sotto il tetto tabella (10-15/h). Piu' margine anti-ban.
total-pm-limit: 999                        # [cosmetic] 0-0 produceva "Limit Reached" nei log; DM gestiti solo dal branch personalcoaching, qui non partiranno mai (pm-percentage: 0). Solo cosmetica.
total-scraped-limit: 200-300               # ALTO: NON deve mai scattare. 0-0 farebbe finire subito la sessione (bug GA: scraped fa parte della condizione di stop)

# ---------------------------------------------------------------------------
# Daily Budget (PERSISTENTE across riavvii del bot)
# I limiti "total-*-limit" sopra sono per-sessione e si azzerano ad ogni avvio.
# Se chiudi il PC e riapri, GramAddict NON sa quante azioni hai gia' fatto oggi
# -> rischio di superare i tetti anti-ban. Questi cap sono salvati su disco
# (accounts/<user>/daily_budget.json) e clippano automaticamente i limiti di
# ogni nuova sessione a quanto rimane del cap giornaliero.
# Reset automatico a mezzanotte (calendario locale).
# ---------------------------------------------------------------------------
daily-follows-cap: 70                      # tetto follow/giorno (tabella prudente: 60-70)
daily-likes-cap: 150                       # tetto like/giorno   (tabella prudente: 120-150)
daily-unfollows-cap: 100                   # tetto unfollow/giorno alzato a 100
daily-comments-cap: 80                     # [safety #1] ridotto da 100: tetto giornaliero piu' prudente sull'azione piu' rischiosa.
daily-pm-cap: 0                            # OFF su main (DM disabilitati, vedi total-pm-limit)

# ---------------------------------------------------------------------------
# AI Comments (HuggingFace Space mattysaints/instagram_bot) - ATTIVO
# Il bot POSTa caption+metadata al Space, lo Space usa HF Inference Providers
# (gpt-oss-120b -> Llama 3.3 70B -> Mistral Small 3.1 24B in cascata) e
# risponde con un commento breve, in italiano, senza emoji/#/!. Se lo Space
# fallisce (rete, 5xx, timeout, cold-start, guardrail) il bot cade su
# comments_list.txt -> zero rischio di crash.
#
# Setup:
#   1. Lo Space e' gia' deployato: https://huggingface.co/spaces/mattysaints/instagram_bot
#   2. La bearer key vive in .env.local come IG_COMMENT_SPACE_KEY=sk_...
#      (caricata automaticamente da ai_comment.py, o via run-dynamic.py / run-bot.sh)
#   3. Per switchare Space (o testare localmente): cambia ai-comments-space-url.
#
# NB: i commenti restano comunque uno strumento ad ALTO rischio anti-spam.
# Tabelle anti-ban 2026: max 5-10 commenti/giorno, mai >2 nello stesso post,
# pause >60s tra due commenti consecutivi (gia' enforce-ato dal throttler).
# ---------------------------------------------------------------------------
ai-comments-enabled: true                                              # ATTIVO: usa lo Space HF
ai-comments-space-url: https://mattysaints-instagram-bot.hf.space      # override se testi in locale (es. http://localhost:7860)
# ai-comments-space-key: "sk_..."                                       # NON mettere qui: usa env IG_COMMENT_SPACE_KEY
ai-comments-language: Italian              # lingua dei commenti generati
# [11/09/2026] Hint riscritto dopo il banco di prova (tools/ai_comment_bench.py, 51 caption
# reali giudicate alla cieca da un panel: nuovo vince 37 a 10, allucinazioni visive 25->3 su 51).
# Punti chiave: il modello NON vede la foto; da' del tu all'autore; UN dettaglio con parole
# proprie, niente parafrasi; gergo palestra solo se la caption parla di allenamento; lutto/malattia
# = una riga sobria di vicinanza; niente 'continua cosi''. A ogni chiamata il bot appende una
# micro-istruzione di variazione diversa (ai_comment._VARIATIONS): un prompt statico non puo'
# variare attacco e chiusura tra un commento e l'altro. Per provare un hint nuovo prima di
# metterlo qui: python tools/ai_comment_bench.py --variant X --hint-file tools/hints/X.txt
ai-comments-prompt-hint: "Commenta come chiunque scorra il feed: vai in palestra ma non sei un coach, non vendi nulla, non parli di te. Dai del tu all'autore del post; non nominare mai chi scrive. NON vedi foto né video, hai solo il testo: niente luce, sfondo, colori, cielo, sorriso, fisico, pose, muscoli, condizione, niente 'si vede', 'si sente', 'sembra'; se la caption nomina una di queste cose (es. 'tramonto') puoi riprenderla. Reagisci a UN solo dettaglio con parole tue: non riassumere la caption, non copiare più di due parole consecutive, niente schema 'pezzo di caption, virgola, giudizio' ('105 kg, che spinta'). Gli hashtag valgono come parole; ignora sigle oscure, parti troncate e @handle (mai scrivere @), non copiare parole straniere. Gergo da palestra solo se la caption parla di allenamento, gara o dieta. Per lutto o malattia una riga sobria di vicinanza, senza elogi né consigli. Frase completa con verbo, 6-15 parole, punto finale, italiano colloquiale (ci sta un 'dai che' o un 'comunque'). Vietati: prima persona (adoro, penso, per me), riempitivi (davvero, pura, energia, vibe, mood, contagioso, al top) e astratti in chiusura (passione, emozione, disciplina). Mai 'Quel/Quella/Quei/Quelle' all'inizio. Mai chiudere con formule fatte: 'continua così', 'forza', 'complimenti', 'grande', 'che chiusura' sono vietate. Segui l'istruzione di variazione che trovi in coda."
ai-comments-fallback-to-file: false        # [11/09/2026] OFF: un commento fisso dal txt non conosce il post e sotto una foto qualunque e' fuori contesto. Se l'AI non risponde o l'output viene scartato, resta il solo like.
# [11/09/2026] Qualita' commenti. Il modello NON vede la foto, riceve solo la
# caption. Analisi di 1971 commenti AI nei log: 46% generati con caption vuota o
# di sole emoji (il modello inventava "la simmetria del petto" sotto a "☃️☃️"),
# 36% con gergo bodybuilding su post che non c'entravano, 7% mozzati, 1.6%
# rivolti a "Mattia" (chi scrive). Da qui:
ai-comments-min-caption-words: 3           # sotto 3 parole vere (emoji/hashtag non contano) NON si chiama l'AI
ai-comments-allow-no-caption: false        # false = senza caption si SALTA il commento (resta il like). Il file di fallback e' gergo fitness generico: non e' un'alternativa migliore
ai-comments-author-name: Mattia            # i commenti che nominano chi scrive vengono scartati


## Stories OFF: su IG 300 il ring storie NON si apre ("Failed to open the story container",
## 0 storie viste in tutto lo storico + crash 14/06 23:44). Rischio/instabilita' per zero
## beneficio -> disattivate. Il warm-follow si regge benissimo sui like.
stories-count: 0
stories-percentage: 0

# ---------------------------------------------------------------------------
# Ending Session Conditions
# ---------------------------------------------------------------------------
end-if-likes-limit-reached: false          # [v2] NON chiudere la sessione se solo i like sono al cap. Cosi' il bot continua a usare follow/commenti residui invece di aprire sessioni "fantasma" da 28s che terminano subito (vedi log 22:51-23:31 del 10/05). La fine sessione resta governata da end-if-follows-limit-reached: true.
end-if-follows-limit-reached: false        # [v3] NON chiudere la sessione al cap follow: il budget follow giornaliero (70/gg) si esaurisce a meta' giornata e con 'true' TUTTE le sessioni successive erano fantasma (0 azioni, ~1min) pur avendo like/commenti residui. Con 'false' la sessione prosegue con like+commenti e termina correttamente al limite interazioni/successful (governato da total-interactions/total-successful, non mutabili).
end-if-watches-limit-reached: false
end-if-comments-limit-reached: false
end-if-pm-limit-reached: false

# ---------------------------------------------------------------------------
# Scheduling - 5 micro-sessioni distribuite su tutta la giornata
# Mai sessioni notturne (00-08), pause minime di 90 min tra una sessione e l'altra,
# attivita' concentrate nelle ore di reale uso umano di IG.
# ---------------------------------------------------------------------------
working-hours: [20.56-22.08, 22.10-23.22, 23.31-00.43, 00.43-01.55]   # generata dinamicamente da run-dynamic.py
time-delta: 0-1                          # randomizza partenza di 5-25 min
repeat: 1-5                                # [Opzione A] pausa minimale (1-5 min) tra fine sessione e ricalcolo working-hours: cosi' il vero gap tra le sessioni e' SEMPRE governato da working-hours (run-dynamic.py), non si somma a 60-120 min extra che facevano slittare le sessioni di ore.
total-sessions: -1                         # loop infinito (rispetta working-hours)
