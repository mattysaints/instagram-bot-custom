# focus Torino/Piemonte). DM disabilitati su questo branch (main): solo
# follow + like + commenti AI.
#
# Target giornaliero:
#   follow:   60-70    | like: 120-150 | commenti: 60-90 (AI via HF Space) | DM: 0
# Rate orario garantito:
#   follow:  <= 8-10/h | like: <= 15-20/h | commenti: <= 10-15/h
# Strategia: 5 micro-sessioni brevi in fasce umane, niente raffiche.
