##############################################################################
# Config "CULTURISMOITALIANO FOLLOWING" - ONE-SHOT manuale.
#
# Scopo: pescare utenti dai following di @culturismoitaliano (1400+ profili
# fitness IT verificati) e interagirci. Il filtro follower 5k-10k richiede
# `filters.yml` temporaneamente modificato: lanciare via lo script wrapper
#   ./run-culturismo-following.sh
# che fa backup + patch + restore automatici. NON lanciare direttamente
# con `python run.py --config ...` altrimenti userebbe il filter 80-7000.
#
# Lancio wrapper:
#   ./run-culturismo-following.sh
#
# Cap sessione: 8-12 follow, 20-30 like, 0 commenti (basso volume, target).
##############################################################################

# ---------------------------------------------------------------------------
# General Configuration
# ---------------------------------------------------------------------------
username: marramattia_fmgpro
device: f2487e11                           # OnePlus 9 Pro fisico (era emulator-5554)
app-id: com.instagram.android
use-cloned-app: false
allow-untested-ig-version: true
screen-sleep: true
screen-record: false
speed-multiplier: 0.85
debug: false
close-apps: false
kill-atx-agent: false
restart-atx-agent: false
disable-block-detection: false
disable-filters: false
dont-type: true
total-crashes-limit: 3
count-app-crashes: false
shuffle-jobs: false
truncate-sources: 1-1                      # una sola sorgente, no truncate
scroll-skip-start: 15-60
resume-from-last-position: true            # riprende da dove si era fermato
resume-anchor-search-limit: 50
resume-cooldown-days: 3                    # riprova la stessa sorgente dopo 3gg
hot-zone-screens: 3
hot-zone-jump-flings: 4
hot-zone-max-jumps: 2

# Action burst guard
action-throttle-enabled: true
action-throttle-follow-min: 25-60
action-throttle-like-min: 8-20
action-throttle-unfollow-min: 20-45
action-throttle-comment-min: 60-180
action-throttle-pm-min: 120-300

# ---------------------------------------------------------------------------
# Actions - blogger-following = pesca chi il target SEGUE (non i suoi followers)
# ---------------------------------------------------------------------------
blogger-following: [culturismoitaliano]

watch-video-time: 8-25
watch-photo-time: 2-5
delete-interacted-users: false
sort-followers-newest-to-oldest: true
unfollow-delay: 30
delete-removed-followers: false
telegram-reports: false

# ---------------------------------------------------------------------------
# Source Limits (per singolo blogger, dentro la sessione)
# ---------------------------------------------------------------------------
interactions-count: 10-15
likes-count: 2
likes-percentage: 85-95
carousel-count: 1-2
carousel-percentage: 50-70
max-comments-pro-user: 0
interact-percentage: 70-85
follow-percentage: 50-65
follow-limit: 8-12
skipped-list-limit: 40-60                  # tolleranza alta: il filtro 5-10k scarta molto
skipped-posts-limit: 4
fling-when-skipped: 0
min-following: 50

# ---------------------------------------------------------------------------
# Total Limits Per Session
# ---------------------------------------------------------------------------
total-likes-limit: 20-30
total-follows-limit: 8-12
total-unfollows-limit: 0-0
total-watches-limit: 0-0
total-successful-interactions-limit: 8-12
total-interactions-limit: 999
total-comments-limit: 0-0
total-pm-limit: 0-0
total-scraped-limit: 200-300

# ---------------------------------------------------------------------------
# Daily Budget (PERSISTENTE - condiviso col config.yml principale)
# ---------------------------------------------------------------------------
daily-follows-cap: 70
daily-likes-cap: 150
daily-unfollows-cap: 70
daily-comments-cap: 0
daily-pm-cap: 0

stories-count: 0
stories-percentage: 0

# ---------------------------------------------------------------------------
# Ending Session Conditions
# ---------------------------------------------------------------------------
end-if-likes-limit-reached: true
end-if-follows-limit-reached: true
end-if-watches-limit-reached: false
end-if-comments-limit-reached: false
end-if-pm-limit-reached: false

# ---------------------------------------------------------------------------
# Scheduling - ONE-SHOT
# ---------------------------------------------------------------------------
total-sessions: 1
time-delta: 0-0

# ---------------------------------------------------------------------------
# AI Comments (disabilitati: qui vogliamo solo follow+like, non commenti)
# ---------------------------------------------------------------------------
ai-comments-enabled: false
