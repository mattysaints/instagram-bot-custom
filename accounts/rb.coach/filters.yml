##############################################################################
# Filtri - @rb.coach  (brand di coaching)
# Doc: https://docs.gramaddict.org/#/configuration?id=available-filters
# NB: per disattivare un filtro commentalo con #, non cancellarlo.
##############################################################################

##############################################################################
# OBIETTIVO DI QUESTO ACCOUNT: trovare CLIENTI PAGANTI per il coaching, con
# priorita' Milano/Lombardia.
#
# Il cliente tipo e' una persona normale che si allena e vuole essere seguita:
# qualche centinaio di follower, segue molti profili fitness, posta con una
# certa regolarita'. NON e' un professionista del settore, che non comprera'
# mai coaching perche' lo vende lui.
#
# Filtri volutamente diversi da quelli del profilo personale
# (../roberto_buonomo_ifbbpro/filters.yml), che insegue reputazione e non
# clienti e quindi cerca un pubblico completamente diverso.
##############################################################################

## Filters on profile type
#
# PRIVATI: ACCETTATI (scelta del 23/08/2026, diversa dal profilo personale).
# Nei log del 23/08 i privati erano 187 scarti su 332, il 56% del totale: ogni
# scarto costava comunque l'apertura del profilo, e su 110 profili aperti solo
# 9 diventavano interazioni utili. Per un business di coaching la persona
# normale con profilo privato E' il cliente tipo, non un profilo da evitare.
#
# CONSEGUENZE, da tenere a mente prima di rimettere true:
#  - su un privato non si possono mettere like: il follow e' per forza "a
#    freddo" e salta il gate warm-follow di follow-only-if-engaged
#    (comportamento voluto e documentato in core/interaction.py:405-413);
#  - last_post_max_age_days non e' valutabile (griglia non visibile) e va in
#    fail-open (core/filter.py:496-508): sui privati quel filtro non filtra;
#  - i follow ai privati restano "richieste in sospeso" finche' non accettano,
#    quindi il follow-back e' piu' lento da misurare.
# Restano attivi tutti gli altri filtri (follower, following, potency ratio,
# numero di post, bio): sui privati sono comunque leggibili.
skip_if_private: false
skip_if_public: false
skip_business: false                       # molti utenti normali hanno l'account creator per le statistiche: escluderli taglierebbe clienti veri
skip_non_business: false
skip_following: true                       # non rifare chi gia' segui
skip_follower: true                        # chi ti segue gia' non va ri-ingaggiato
skip_if_link_in_bio: false
follow_private_or_empty: true              # coerente con skip_if_private: senza questo i privati verrebbero aperti e poi scartati lo stesso ("follow_private_or_empty is disabled in filters. Skip.")

## Pre-flight username filters (valutati SENZA aprire il profilo: 3-5s risparmiati per skip)
skip_username_patterns:
  - "_official$"
  - "\\.shop$"
  - "_shop$"
  - "_store$"
  - "^crypto"
  - "^nft"
  - "^promo"
  - "^bot[_0-9]"
skip_username_with_emoji: true
skip_username_longer_than: 28
skip_username_digit_ratio_above: 0.6

## Filters on profile stats - tarati sul CLIENTE, non sull'addetto ai lavori
min_followers: 200                         # sotto i 200 di solito e' un account appena aperto o inattivo: non risponde e non compra
max_followers: 4000                        # sopra i 4k nel fitness sei quasi sempre un micro-influencer o un PT: vendi coaching, non lo compri
min_followings: 80                         # segue almeno 80 profili -> usa Instagram davvero
max_followings: 4000
min_potency_ratio: 0.3                     # il principiante segue molti e ha pochi follower: ratio basso e' NORMALE per il cliente tipo
max_potency_ratio: 4                       # oltre il 4 inizia a essere un "personaggio", non un cliente
min_posts: 9                               # profilo vissuto, non vetrina vuota
mutual_friends: -1
last_post_max_age_days: 45                 # attivo nell'ultimo mese e mezzo. Fail-open: se non legge la data non scarta

## Filters on biography and name
# Oltre allo spam, qui si escludono i COLLEGHI: chi si presenta come coach o
# preparatore non comprera' un percorso di coaching. Volutamente si evita la
# parola "coach" da sola, che matcherebbe anche "coached by @tizio" (cioe' un
# cliente di un concorrente, che invece interessa).
blacklist_words: [onlyfans, onlyf, escort, sex, "link in bio", telegram, vendita, sconto, codice sconto, spedizione, dropship, crypto, forex, casino, scommesse, "personal trainer", "coach online", "online coach", preparatore, istruttore, "chiedi il tuo piano", "scrivimi per"]
# mandatory_words: [fitness, palestra, gym]      # non attivato: taglia troppo e costa una lettura bio in piu' per ogni profilo
# specific_alphabet: [LATIN]                     # disabilitato (costoso)
# biography_language: [it]                       # disabilitato (costoso)

##############################################################################
# Filtri commenti
# NB: per commentare servono DUE flag a true insieme:
#   1) comment_<media-type>  (photos/videos/carousels)
#   2) comment_<job-name>    (es. blogger_followers)
# Se ne manca uno -> "Can't comment this MediaType.X because filters are: ..."
##############################################################################
comment_blogger_followers: true            # commenta i follower dei blogger (il target)
comment_hashtag_likers_recent: true        # e i likers recenti degli hashtag
comment_hashtag_likers_top: false
comment_hashtag_posts_top: false
comment_hashtag_posts_recent: false
comment_place_likers_top: false
comment_place_likers_recent: true         # attivo: il job place-likers-recent commenta (bacino Milano)
comment_place_posts_top: false
comment_place_posts_recent: false
comment_blogger_following: false
comment_blogger_post_likers: false
comment_blogger: true                      # commenta i post dei competitor/influencer (job `blogger`)
comment_interact_usernames: false
comment_interact_from_file: false
comment_feed: false
comment_photos: true
comment_videos: true
comment_carousels: true

## Filtri DM (non usati: DM disattivati su questo account)
pm_to_private_or_empty: false

## Filtri sul numero di likers del post (non usati dai job attivi)
min_likers: 1
max_likers: 1000
