##############################################################################
# Config ONE-SHOT - @rb.coach
# Una sola sessione, parte SUBITO al lancio: niente working-hours, niente loop.
# Serve per test manuali e per la fase di warm-up.
#
# Lancio:
#   python run.py --config accounts/rb.coach/config-once.yml
#
# I cap giornalieri sono condivisi con config.yml (daily_budget.json).
##############################################################################

username: rb.coach
device: emulator-5554                      # AVD rbcoach (deve combaciare con config.yml)
app-id: com.instagram.android
use-cloned-app: false
allow-untested-ig-version: true
screen-sleep: true
screen-record: false
speed-multiplier: 0.9
debug: false
close-apps: false
kill-atx-agent: false
restart-atx-agent: false
disable-block-detection: false
disable-filters: false
dont-type: true
total-crashes-limit: 3
count-app-crashes: false
shuffle-jobs: true
truncate-sources: 4-6
scroll-skip-start: 15-60
resume-from-last-position: true
resume-anchor-search-limit: 30
resume-cooldown-days: 7
hot-zone-screens: 3
hot-zone-jump-flings: 4
hot-zone-max-jumps: 2

action-throttle-enabled: true
action-throttle-follow-min: 30-70
action-throttle-like-min: 10-22
action-throttle-unfollow-min: 25-50
action-throttle-comment-min: 300-420
action-throttle-pm-min: 999999

# ---------------------------------------------------------------------------
# Actions - sottoinsieme ristretto per il test
# ---------------------------------------------------------------------------
blogger-followers: [fitlab_milano, ifbbproitaly, bodybuilding_italia_community, malatidipalestraofficial, giusepperomanocoach]

watch-video-time: 8-25
watch-photo-time: 2-5
delete-interacted-users: false
sort-followers-newest-to-oldest: true
unfollow-delay: 3
delete-removed-followers: false
telegram-reports: false

# ---------------------------------------------------------------------------
# Source Limits
# ---------------------------------------------------------------------------
interactions-count: 8-12
likes-count: 2
likes-percentage: 85-95
carousel-count: 1-2
carousel-percentage: 50-70
max-comments-pro-user: 1
comment-percentage: 25-35
pm-percentage: 0
interact-percentage: 70-85
follow-percentage: 55-70
follow-limit: 5-8
skipped-list-limit: 30-45
skipped-posts-limit: 4
fling-when-skipped: 0
min-following: 50

# ---------------------------------------------------------------------------
# Total Limits - sessione singola contenuta
# ---------------------------------------------------------------------------
total-likes-limit: 16-22
total-follows-limit: 8-10
total-unfollows-limit: 0-0
total-watches-limit: 0-0
total-successful-interactions-limit: 8-10
total-interactions-limit: 999
total-comments-limit: 3-5
total-pm-limit: 0-0
total-scraped-limit: 200-300

daily-follows-cap: 60
daily-likes-cap: 130
daily-unfollows-cap: 60
daily-comments-cap: 40
daily-pm-cap: 0

stories-count: 0
stories-percentage: 0

end-if-likes-limit-reached: true
end-if-follows-limit-reached: true
end-if-watches-limit-reached: false
end-if-comments-limit-reached: false
end-if-pm-limit-reached: false

# ---------------------------------------------------------------------------
# AI Comments
# ---------------------------------------------------------------------------
ai-comments-enabled: true
ai-comments-space-url: https://mattysaints-instagram-bot.hf.space
ai-comments-language: Italian
ai-comments-prompt-hint: "Commenta come Roberto: allenatore con vent'anni di sala, tono naturale e diretto, come parlerebbe di persona, dà del tu, nessun vocativo. Non è un venditore: mai coaching, schede, consulenze, team, palestra sua, prezzi, link, DM. Non nominarlo e non rivolgerti a lui: parli con chi ha pubblicato. NON vedi foto né video, hai solo il testo: niente giudizi su fisico, posa, esecuzione, luce, sguardo; niente 'si vede', 'sembra', 'si nota'. Reagisci a UN dettaglio della caption con parole tue, senza riassumerla e senza copiarne più di due parole di fila; se un dettaglio concreto non c'è, resta generale ma umano. Chi legge di solito si allena, a volte è un collega: con chi si allena parole semplici da allenatore, zero gergo; con un collega da pari, nota cosa ha gestito, mai correggerlo, mai spiegargli il mestiere, mai valutarlo. Nessun consiglio non chiesto, nessuna correzione, nessuna verità assoluta. I numeri solo se sono nella caption, mai come prescrizione. Sul cibo ragiona senza predica. Lutto, malattia, infortunio: una riga sobria di vicinanza, niente tecnica. Vietati: ragazzi, amici, guarda, senti, ovviamente, praticamente, magari, diciamo, cioè, insomma; costanza, dedizione, disciplina, percorso, sacrificio, sostenibile, stile di vita, equilibrio; pazzesco, incredibile, top, spettacolo, grande, bravo, gran lavoro, complimenti, continua così, forza. Frase completa con verbo, 6-14 parole, punto finale, mai emoji né hashtag né punti esclamativi. Evita frasi generiche e riferimenti all'arrivo di un contenuto sulla piattaforma. Se la caption non offre uno spunto naturale e pertinente, rispondi SKIP. Segui l'istruzione di variazione in coda."
ai-comments-fallback-to-file: false        # OFF: un commento fisso dal txt non conosce il post. Senza AI, solo like.
ai-comments-min-caption-words: 3           # sotto 3 parole vere (emoji/hashtag non contano) NON si chiama l'AI
ai-comments-allow-no-caption: false        # senza caption si SALTA il commento (resta il like)
ai-comments-author-name: Roberto           # i commenti che nominano chi scrive vengono scartati

# ---------------------------------------------------------------------------
# Scheduling - ONE-SHOT
# ---------------------------------------------------------------------------
# working-hours commentata -> il bot parte subito
# repeat commentata        -> nessuna sessione successiva
total-sessions: 1
time-delta: 0-0
