##############################################################################
# Config principale - @rb.coach (ROBERTO BUONOMO & COACHING TEAM)
#
# CHI E': Roberto Buonomo, IFBB PRO (card a 25 anni, 2019 - tra i piu' giovani
# pro italiani in attivita'). Campione Italiano IFBB 2019 heavyweight -100kg +
# titolo assoluto, 2o Arnold Classic Barcelona 2019, Campione Italiano WABBA
# Junior 2017, BB Overall Ben Weider Classic 2020. Nato a Napoli il 14/10/1993,
# opera a Milano. Master in Economia e Finanza.
# Certificazioni: Personal Trainer, Educatore Alimentare, Functional Fitness.
#
# BUSINESS: CEO di FIT LAB Milano (Corso di Porta Romana 72) - studio privato
# con PT Class (max 4-5 persone), one-to-one, analisi antropometrica.
# Team RB Coaching: 18 IFBB PRO Card prodotte, 1 atleta qualificato Olympia.
# Coaching online: scheda + dieta + integrazione + supporto WhatsApp + check
# settimanali. Collabora con biologo nutrizionista.
#
# OBIETTIVO BOT: crescere bacino targetizzato nel bodybuilding agonistico e
# nel fitness Milano/Lombardia. Solo follow + like + commenti AI. DM: 0.
#
# ATTENZIONE - WARM-UP: se l'account non ha mai usato automazione, per le
# prime 2 settimane dimezza i cap (follow 25-30/g, like 50-60/g, commenti 0)
# e alza gradualmente. Vedi SETUP.md.
#
# Target giornaliero a regime:
#   follow: 50-60 | like: 100-130 | commenti: 25-40 (AI via HF Space) | DM: 0
# Rate orario:
#   follow: <= 8/h | like: <= 15/h | commenti: <= 8/h
##############################################################################

# ---------------------------------------------------------------------------
# General Configuration
# ---------------------------------------------------------------------------
username: rb.coach
device: emulator-5554                      # deve combaciare con -Serial in deploy/watchdog.ps1 (avd bot_rb)
app-id: com.instagram.android
use-cloned-app: false
allow-untested-ig-version: true
screen-sleep: false                        # non spegnere lo schermo: evita il blocco PIN tra sessioni
screen-record: false
speed-multiplier: 1.0                      # default upstream: il ritmo umano lo danno le pause casuali, 0.9 allungava ogni attesa dell'11% senza aggiungere varianza
debug: false
close-apps: false
kill-atx-agent: false
restart-atx-agent: true                    # se uiautomator si rompe a meta' sessione, ricrealo
disable-block-detection: false             # IMPORTANTE: rileva action-block
disable-filters: false
dont-type: true
total-crashes-limit: 3
count-app-crashes: false
shuffle-jobs: false                        # ordine fisso: blogger-followers, poi hashtag
truncate-sources: 8-10                     # sorgenti per sessione
scroll-skip-start: 30-100
resume-from-last-position: true            # riprende da dove si era fermato su ogni sorgente
resume-anchor-search-limit: 12
resume-cooldown-days: 5
hot-zone-screens: 2                        # reagisci presto alle schermate senza utenti freschi
hot-zone-jump-flings: 6
hot-zone-max-jumps: 2

# [follow-back] Ricalcolo automatico del follow-back-rate per sorgente:
# le sorgenti che fanno ricambiare il follow vengono pescate piu' spesso.
auto-fbr-refresh: false                    # OFF su richiesta: la scansione dei follower a inizio sessione non serve su questi profili
auto-fbr-interval-hours: 24
auto-fbr-max-scan: 0                       # 0 = scansione completa

# [follow-back] Warm follow: segui solo chi hai davvero ingaggiato prima.
follow-only-if-engaged: true
follow-min-engagement: 1

# Action burst guard - niente raffiche visibili a IG
action-throttle-enabled: true
action-throttle-follow-min: 30-70          # ~50-120s tra 2 follow
action-throttle-like-min: 10-22            # ~10-22s tra 2 like
action-throttle-unfollow-min: 25-50
action-throttle-comment-min: 300-420       # 5-7 min tra 2 commenti -> max ~8-12/h
action-throttle-pm-min: 999999             # DM OFF su questa config

# ---------------------------------------------------------------------------
# Actions - sorgenti
# ---------------------------------------------------------------------------
# NB: formato inline [a, b, c]. La sintassi YAML "a lista" rompe il parser.
# IMPORTANTE: ogni username DEVE esistere su IG. Si verifica sull'emulatore
# con tools/verify-ig-handles.py (vedi nota piu' sotto), NON su instagram.com.
#
# STRATEGIA @rb.coach: bacino ITALIANO, con priorita' Lombardia. Il target
# sono persone che si allenano e potrebbero diventare clienti, non altri pro.
#
# blogger-followers = pesca i FOLLOWER di questi account e ci interagisce
# (like + follow + commento). NON tocca i post dell'account stesso: per quello
# c'e' il job `blogger` piu' sotto.
#
# Ordine dei gruppi (il bot li pesa poi da solo con auto-fbr-refresh):
#   1. Palestre Lombardia  -> follower locali, i piu' convertibili in clienti
#   2. Competitor italiani -> pubblico gia' educato al coaching a pagamento
#   3. Brand integratori   -> bacino ampio, italiano, meno mirato
#   4. Federazioni/community
#
# Tutti gli handle sotto sono stati verificati il 22/08/2026 APRENDOLI SULL'EMULATORE
# con tools/verify-ig-handles.py. Non usare instagram.com/USERNAME per controllare:
# risponde con la pagina di login sia per i profili veri sia per quelli
# inesistenti, e cosi' erano entrate 11 sorgenti morte su 72. Una sorgente
# inesistente brucia ~30s a sessione finche' la quarantena non la esclude.
# ORDINE DEI JOB = ordine di queste chiavi (GramAddict/core/config.py:191).
# `blogger` sta PRIMA di `blogger-followers` di proposito. La sessione si
# interrompe appena e' raggiunto total-successful-interactions-limit
# (bot_flow.py:432), e blogger-followers da solo lo esaurisce sempre: con
# l'ordine inverso il job blogger non veniva MAI eseguito e l'account non
# commentava piu' nulla. blogger costa poco (si ferma da solo a budget
# commenti finito), quindi va servito per primo.
#
# blogger = commenta i post DI QUESTI ACCOUNT (non dei loro follower).
# Serve a farsi vedere sotto ai post dei competitor e degli influencer, dove
# c'e' gia' il pubblico giusto che legge i commenti.
#
# Volutamente corta: commentare sotto ai big e' molto esposto, un commento
# fuori luogo lo vedono in migliaia. Solo italiani, come richiesto.
# NB: il volume reale e' governato da total-comments-limit e dal throttle,
# non dalla lunghezza di questa lista.
# Tolto il 24/08/2026 sera: virginactiveit ha i COMMENTI LIMITATI su tutto il
# profilo (3 post su 3, 11,5 min per zero commenti): il job blogger li' non
# potra' mai riuscire. Resta in blogger-followers, dove contano i suoi
# follower e non i commenti. La lista e' CORTA per il budget: con 11 account
# e ri-commento a 48h il tetto reale e' ~5-6 commenti/giorno dal job blogger.
# Per alzare i commenti servono altri handle verificati con
# tools/verify-ig-handles.py (mai aggiungerli senza verifica).
blogger: [malatidipalestraofficial, ricette_ghisa, valentinotozzi, fit.italia, pieronocerino1, giampaolo_fusco_thecoach, maurofitnesscoach, emanuelemauti3, paolozottatrainer, ironmanager, informaconfede]

# Finestra di ri-commento per il SOLO job blogger (ore). Sovrascrive
# can-reinteract-after, che resta a 168h per tutti gli altri job.
# Serve perche' i 168h globali mettevano in quarantena 6 sorgenti su 8: il
# 24/08 il job commentava ~2 volte al giorno contro un daily-comments-cap
# di 40. Con 48h ogni big si ricommenta al massimo a giorni alterni, che
# sotto ai post di un competitor e' una presenza normale, non insistente.
blogger-reinteract-after: 48

# Niente commenti sui follower di queste pagine (le seguiamo gia' noi: sono
# palestre/competitor/brand, non concorrenza da "farsi notare" sotto ai post).
# Like e follow restano invariati, cambia solo il commento AI.
# Tolte il 24/08/2026 sui numeri di source_stats/history_filters (22-24/08):
#   pieronocerino1 (41 profili aperti, 0 azioni), kickandpunch (37 -> 1),
#   sportingmilano3 (88 -> 5, 67% di account privati), actionfit.cologno
#   (la sera del 24/08, gia' coi privati accettati: 84 visite -> 13 azioni,
#   meta' dell'audience sotto i filtri numerici). pieronocerino1 resta
#   nel job `blogger` qui sopra: sono i suoi FOLLOWER a non rendere, non i
#   commenti sotto ai suoi post.
blogger-followers-no-comment: true
blogger-followers: [20hourspalestre, actionfit.carate, actionfit.cerromaggiore, actionfit.fulviotesti, actionfit.italia, actionfit.liguria, afmi2_segrate, alessio_mirin, allenamentofunzionalemilano, animacorpofitness23, anytimefitness_milanorubattino, anytimefitnessitalia, areafitnessurbanclub, aspria_harbourclub, ceresio7gymspa, cerva16_milano, club2d, coach.valentinotozzi, corework_milano, crossfit_darsena, crossfit_portanuova, crossfitbicocca, crossfitcorsico, crossfitmissaglia, edwin_underwood, emanuelemauti3, energypaderno, esport_palestre_cinisello, femstudio_milano, fit.italia, fitactive.rho, fitactive_bustoarsizio, fitactive_cologno_monzese, fitactive_il_fitness_x_tutti, fitactive_legnano, fitactive_milanoripamonti, fitactive_saronno, fitactivecinisellobalsamo, fitactivemonzastucchi, fitactivesegrate, fitclass_tailoredworkout, fitexpress_brand, fitexpress_pioltello, fithouse_monza, fitlab_milano, fitlevel_palestreacerbi, fitmifitnessclub, fitup_bernareggio, gclub_torribianche, getfitlifestylemilano, giampaolo_fusco_thecoach, giulioramazio, goldsgymitaly, greta_francesconi_ptrainer, iltempiodellosport.asd, informaconfede, ironfitmonza, ironmanager, jofitpersonaltrainer___, leviatano89, malatidipalestraofficial, marcodallabattista_pt, matteoinno88, maurofitnesscoach, maxifit.bollate, maxifit.rho, mcfit_it, melissa.ranni, milanotrainingclub, ms8trainingspace, officinepurestrength, oneforall.hub, palestra_magic_power, palestreopenclub, palextra_monza, paolozottatrainer, projectstrength_alessioferlito, ptstudiomilano, reverbia_pt, ricette_ghisa, roberto.personaltrainer, selenegenisella, spaziofitnessclub, sportingclubleonardo, sportplus_ssd, sportvillagemonza, t2_truetraining, tonic_milano, tonicitalia, ttcage_studio, upgradetraining.center, uptown.milano, valentinotozzi, virginactiveit, viveredipalestra]

# Sui profili grandi si fa SOLO il commento pubblico: niente like, niente
# follow, niente storie. Like/follow/sticker restano sui profili piccoli
# (i follower dei blogger), che sono il target che converte.
# Questo flag sospende anche i limiti di dimensione di filters.yml per il
# solo job `blogger`: con max_followers a 4000 un account da 300k verrebbe
# scartato e non commenteremmo nulla.
blogger-comment-only: true

# Ogni profilo toccato finisce in interacted_users.json e senza questo viene
# saltato PER SEMPRE ("already interacted ... Skip."). Sul job blogger vorrebbe
# dire commentare i competitor una volta sola e mai piu'. 168h = 7 giorni.
# NB: e' un parametro GLOBALE, vale anche per blogger-followers e hashtag; li'
# l'effetto e' pero' contenuto, perche' chi gia' segui viene escluso da
# skip_following e chi hai unfolloato da was_unfollowed_before.
can-reinteract-after: 168


# Hashtag: pesca chi ha messo LIKE ai post recenti. Lead piu' caldi dei
# semplici follower (interesse esplicito e recente).
# Solo fitness generalista italiano e locale Milano: niente bodybuilding, che
# e' il bacino del profilo personale. Tutti verificati sull'emulatore il
# 22/08/2026 (tools/verify-ig-handles.py --hashtag).
# Tolti di proposito, con la prova nel primo contenuto della griglia:
#   primaedopo (estetica/chirurgia), coachonline (business coaching),
#   motivazionefitness (gruppi di scambio like), preparatoreatletico (altri
#   sport), bodybuildingmilano (bacino del personale), palestraitalia (e' il
#   vecchio nome del Palmeiras: tifosi brasiliani).
hashtag-likers-recent: [trasformazionefisica, ricomposizionecorporea, personaltrainermilano, palestramilano, fitnessmilano, milanofitness, gymmilano, salapesi, ghisa, muscoli, allenamentofemminile, fitnessfemminile, dietaflessibile, nutrizionesportiva, allenamentofunzionale, fitnessitalia]

hashtag-likers-top: [trasformazionefisica, ricomposizionecorporea, personaltrainermilano, fitnessitalia, dietaflessibile]

# Luoghi: pesca chi ha messo like a post GEOLOCALIZZATI a Milano. E' l'unica
# leva che garantisce davvero la prossimita' fisica: un hashtag come
# #palestramilano lo usa anche chi vive a Bergamo, un post geotaggato a Milano
# no. Per uno studio con sede in Corso di Porta Romana e' il bacino migliore.
#
# ATTENZIONE: i nomi devono combaciare con i luoghi REALI di Instagram, che ha
# una sua anagrafica. "Milano, Italy" e' sicuro; per aggiungere palestre o
# quartieri specifici cercali prima nella tab Luoghi dell'app e copia il nome
# esatto, altrimenti il job spreca ~30s a tentativo.
place-likers-recent: [Milano Italy]

## Watching content (umanizza il comportamento)
watch-video-time: 8-25
watch-photo-time: 2-5
delete-interacted-users: false
sort-followers-newest-to-oldest: true
unfollow-delay: 3                          # giorni prima di poter unfolloware (gestito da config-unfollow.yml)
delete-removed-followers: false
telegram-reports: false

# ---------------------------------------------------------------------------
# Source Limits (per singola sorgente, dentro la sessione)
# ---------------------------------------------------------------------------
# Abbassato da 12-18 il 24/08 sera: con il tetto per sorgente a ~13 la
# sessione delle 18:42 ha passato TUTTI i 90 minuti dentro una sola lista
# follower (84 visite su actionfit.cologno, resa 15%). Con 8-12 si cambia
# sorgente 2-3 volte a sessione: follower piu' freschi e meno dipendenza
# dalla singola lista debole.
interactions-count: 8-12
likes-count: 1                             # 1 like per profilo: a parita' di budget like si ingaggia il DOPPIO dei profili, e con follow-only-if-engaged ogni profilo col like e' un candidato follow (il 24/08 i follow si sono fermati a 38/60 proprio per il budget like finito)
likes-percentage: 85-95
carousel-count: 1-2
carousel-percentage: 50-70
max-comments-pro-user: 1
comment-percentage: 25-35                  # ~1 profilo su 3 riceve commento AI
pm-percentage: 0
interact-percentage: 70-85
# Roll alto di proposito: il gate anti-cold-follow e' gia' follow-only-if-engaged,
# e un secondo dado al 55-70% buttava via 1 profilo ingaggiato su 3 a like gia'
# speso (24/08: ~15 profili con engagement mai seguiti). Il tetto vero restano
# follow-limit per sorgente e daily-follows-cap.
follow-percentage: 85-95
follow-limit: 6-9                          # cap per sorgente: distribuisce invece di svuotarne una
skipped-list-limit: 30-45
skipped-posts-limit: 4
fling-when-skipped: 0
min-following: 50                          # non scendere sotto questo numero di seguiti

# ---------------------------------------------------------------------------
# Total Limits Per Session (4 sessioni/giorno via run-dynamic.py)
# follow:   4 x ~13 = ~52/g (cap 60)
# like:     4 x ~32 = ~128/g (cap 130)
# comment:  4 x  6  = ~24/g (cap 40)
# ---------------------------------------------------------------------------
# Con follow-only-if-engaged i like NON sono un contorno: sono cio' che
# produce l'engagement richiesto per poter seguire. Media 32 = daily-likes-cap
# 130 diviso le 4 finestre; con likes-count: 1 ogni like e' un profilo
# ingaggiato, quindi ~30 candidati al follow per sessione.
total-likes-limit: 30-34
total-follows-limit: 12-15
total-unfollows-limit: 0-0                 # unfollow gestito da config-unfollow.yml
total-watches-limit: 0-0
# E' il limite che CHIUDE la sessione (bot_flow.py:432) e va diviso fra due
# job (blogger ne consuma ~5-7; un profilo = una interazione riuscita,
# session_state.py:66). Con likes-count: 1 ogni like e' un profilo riuscito:
# ~30 like + follow + commenti devono starci tutti. A chiudere la sessione
# pensano la finestra dei 90 min e end-if-likes-limit-reached; il tetto
# giornaliero vero resta daily-follows-cap/daily-likes-cap.
total-successful-interactions-limit: 30-36
total-interactions-limit: 999
total-comments-limit: 5-7
total-pm-limit: 0-0
total-scraped-limit: 200-300               # NON 0: con 0 il bot esce subito

# ---------------------------------------------------------------------------
# Daily Budget (persistente su daily_budget.json, condiviso tra le config)
# ---------------------------------------------------------------------------
daily-follows-cap: 60
daily-likes-cap: 130
daily-unfollows-cap: 60
daily-comments-cap: 40
daily-pm-cap: 0

## Watch-stories OFF: guardare le storie durante le interazioni non porta
## nulla e allunga la sessione. NB: e' diverso dal job answer-story-stickers,
## che apre le storie dei target apposta per rispondere ai box domande.
stories-count: 0
stories-percentage: 0

# ---------------------------------------------------------------------------
# Ending Session Conditions
# ---------------------------------------------------------------------------
# true: con follow-only-if-engaged, esaurito il budget like nessuna azione e'
# piu' possibile (engagement sempre 0, "Skip follow: engagement 0 < 1"). Il
# 22-24/08 dopo il like-limit il bot ha aperto 148 profili in 69 min per 1
# solo follow: chiudere subito recupera quel tempo e toglie un pattern
# anomalo (raffica di visite senza azioni).
end-if-likes-limit-reached: true
end-if-follows-limit-reached: false         # non chiudere la sessione al cap follow: continua a likare
end-if-watches-limit-reached: false
end-if-comments-limit-reached: false
end-if-pm-limit-reached: false

# ---------------------------------------------------------------------------
# AI Comments (HF Space mattysaints/instagram_bot)
# Il bot manda caption + metadata allo Space, che risponde con un commento
# breve in italiano. Su qualunque errore (rete, 5xx, rate-limit, guardrail)
# cade su comments_list.txt: nessun crash, nessun commento tipo-bot.
#
# La bearer key sta in .env.local come IG_COMMENT_SPACE_KEY (vedi SETUP.md).
# ---------------------------------------------------------------------------
ai-comments-enabled: true
ai-comments-space-url: https://mattysaints-instagram-bot.hf.space
# ai-comments-space-key: "sk_..."          # NON metterla qui: usa .env.local
ai-comments-language: Italian
ai-comments-prompt-hint: "L'autore del commento e' Roberto Buonomo, IFBB PRO e coach a Milano, fondatore dello studio FIT LAB e del team RB Coaching. Il suo mondo e' seguire persone normali che vogliono cambiare fisico: progressi dei clienti, abitudini sostenibili, allenamento e alimentazione cuciti sulla vita di chi li segue. Chi legge il commento e' una persona che si allena, non un professionista: quindi niente gergo da addetto ai lavori, ma parole che userebbe un allenatore esperto quando parla con chi si allena da solo. Se il post mostra progressi o un confronto nel tempo, il commento riconosce il lavoro fatto nel tempo, non solo il risultato finale. Se parla di allenamento, entra nel merito con misura (esecuzione, gestione dei carichi, recupero). Se parla di cibo, ragiona da educatore alimentare senza fare la predica. Se parla di stanchezza, motivazione o fatica, risponde da umano prima che da coach. IMPORTANTE: adatta il commento al CONTENUTO REALE della caption e non forzare il tema palestra: se il post e' un viaggio commenta il posto, se e' un momento personale commenta con empatia. Cita SEMPRE un dettaglio concreto della caption (una parola, un numero, un esercizio, un luogo) cosi' si capisce che il post e' stato letto. Italiano colloquiale e diretto. MAI nominare coaching, schede, consulenze, FIT LAB, prezzi, link o DM: e' un commento sotto un post, non una pubblicita'. VARIA IL LESSICO: non usare in ogni commento le stesse parole chiave. In particolare NON aprire ne' costruire il commento attorno a parole come costanza, dedizione, disciplina, percorso, sacrificio: sono i tormentoni che rendono evidente che a scrivere e' sempre la stessa entita'. Trova ogni volta un angolo diverso, partendo dal dettaglio concreto del post. MAI emoji, hashtag o punti esclamativi. Una frase breve."
ai-comments-fallback-to-file: true

# ---------------------------------------------------------------------------
# Risposte agli sticker delle storie altrui (box domande)
#
# Il bot apre le storie di questi account e, se trova un box domande, risponde
# con una frase corta generata dallo Space ("cosa alleni oggi?" -> "petto").
# Il nome finisce nella casella risposte dell'autore, dove arrivano poche
# decine di messaggi invece delle migliaia di commenti sotto ai post.
#
# Due modalita', indipendenti:
#  1) sticker-check-percentage -> durante il flusso normale, per ogni
#     profilo candidato il bot apre anche le sue storie e, se trova un box
#     domande, risponde. E' la modalita' principale: colpisce i follower
#     dei blogger, cioe' il target vero.
#  2) answer-story-stickers   -> job dedicato che va sulle storie degli
#     account elencati qui sotto (i big). Serve a farsi notare da loro.
# Ogni risposta e' molto visibile, quindi i volumi restano bassi.
# ---------------------------------------------------------------------------
# answer-story-stickers: [...]   # DISATTIVATO: gli sticker si fanno solo sui
#   profili piccoli, dentro il flusso normale (sticker-check-percentage).
#   Riattivalo solo se vuoi rispondere anche ai box domande dei big.
# 0: il 22-24/08, su 35 aperture di storie, il check non ha trovato NEMMENO
# UN box domande (~10-15 min/giorno per zero risposte). Prima di rialzarlo
# controlla nel log le righe "[sticker]": ora il bot scrive l'esito di ogni
# check, quindi si puo' riattivare a ragion veduta.
sticker-check-percentage: 0

# sticker-replies-limit: 3-5                 # risposte per sessione
# stories-per-source-limit: 6                # storie da controllare per account
ai-sticker-enabled: true
ai-sticker-prompt-hint: "Chi risponde e' Roberto Buonomo, IFBB PRO e coach a Milano. Risponde allo sticker come farebbe un collega che scorre le storie: parola secca o due, niente presentazioni, niente complimenti, niente promozione."

# ---------------------------------------------------------------------------
# Scheduling
# ---------------------------------------------------------------------------
# Le working-hours qui sotto le RISCRIVE run-dynamic.py a ogni lancio: quattro
# sessioni da 90 minuti (gap ~3.75h, jitter fino a +-35 min) a partire
# dall'ora in cui avvii il bot, dentro la fascia consentita 08:00-23:00.
# Quattro e non cinque: pause lunghe tra le finestre (~2-2.5h), come il
# profilo prudente 2025-26, senza rinunciare ai cap giornalieri. Avviarlo vuol dire vederlo lavorare subito.
# Poi, con total-sessions: -1 e repeat, GramAddict ripete quegli orari ogni
# giorno da solo: si rilancia solo per spostare la giornata.
# I due account usano le stesse finestre e lavorano in simultanea (scelta del
# cliente): sul mini PC a 4 core sono due AVD da 2 core che si contendono la
# CPU, quindi sessioni piu' lente. E' il motivo per cui il bot aspetta la
# barra delle schede fino a 90 s e il profilo fino a 30 s invece di usare
# tempi fissi. Per farli lavorare a turno c'e' config-alternato.yml.
working-hours: [21.02-22.32]   # generata dinamicamente da run-dynamic.py
time-delta: 0-0                             # ZERO di proposito: le finestre le calcola gia' run-dynamic.py dall'ora di lancio (con jitter fra una sessione e l'altra). Uno slittamento positivo qui sposterebbe in avanti la prima finestra e il bot, appena avviato, resterebbe fermo ad aspettare invece di partire subito
repeat: 1-5                                 # OBBLIGATORIO per avere piu' di una sessione: senza, GramAddict esce dopo la prima. Pausa minima, poi il bot aspetta la finestra successiva
total-sessions: -1                          # loop senza fine (rispetta le working-hours)
