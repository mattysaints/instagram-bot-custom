##############################################################################
# Config principale - @roberto_buonomo_ifbbpro (profilo personale atleta)
#
# Differenza rispetto a @rb.coach: qui Roberto parla come ATLETA IFBB PRO, non
# come studio di coaching. Il taglio e' verticale sul bodybuilding agonistico e
# guarda anche fuori dall'Italia (top athlete e coach internazionali), dove il
# pubblico e' anglofono.
#
# @rb.coach  -> bacino italiano, Lombardia, clienti di coaching
# questo     -> bacino verticale BB, anche internazionale, peer tra atleti
#
# Chi e': IFBB PRO (card a 25 anni), campione italiano IFBB 2019 heavyweight
# -100kg + assoluto, 2o Arnold Classic Barcelona 2019. Vedi ../rb.coach/KB.md.
#
# ATTENZIONE - WARM-UP: se l'account non ha mai usato automazione, dimezza i
# cap per le prime due settimane. Vedi SETUP.md.
#
# Target giornaliero a regime:
#   follow: 40-50 | like: 90-110 | commenti: 20-30 | DM: 0
##############################################################################

# ---------------------------------------------------------------------------
# General Configuration
# ---------------------------------------------------------------------------
username: roberto_buonomo_ifbbpro
device: f2487e11                           # ADB serial (adb devices -l). Cambia col device reale.
app-id: com.instagram.android
use-cloned-app: false
allow-untested-ig-version: true
screen-sleep: false
screen-record: false
speed-multiplier: 0.9
debug: false
close-apps: false
kill-atx-agent: false
restart-atx-agent: true
disable-block-detection: false
disable-filters: false
dont-type: true
total-crashes-limit: 3
count-app-crashes: false
shuffle-jobs: false
truncate-sources: 6-8
scroll-skip-start: 30-100
resume-from-last-position: true
resume-anchor-search-limit: 12
resume-cooldown-days: 5
hot-zone-screens: 2
hot-zone-jump-flings: 6
hot-zone-max-jumps: 2

auto-fbr-refresh: true
auto-fbr-interval-hours: 24
auto-fbr-max-scan: 0

follow-only-if-engaged: true
follow-min-engagement: 1

action-throttle-enabled: true
action-throttle-follow-min: 30-70
action-throttle-like-min: 10-22
action-throttle-unfollow-min: 25-50
action-throttle-comment-min: 300-420
action-throttle-pm-min: 999999             # DM OFF

# ---------------------------------------------------------------------------
# Actions - sorgenti
# ---------------------------------------------------------------------------
# blogger-followers = pesca i FOLLOWER di questi account.
# Taglio verticale: atleti e coach di bodybuilding agonistico, italiani e
# internazionali. Chi segue questi profili e' gia' dentro al mondo delle gare.
#
# Handle verificati il 19/08/2026.
#
# NOTA sui profili esteri: i follower di johnjewett3 (USA) e
# kuba_sylvester_cielen (PL) sono in larga parte NON italiani. Vanno bene per
# reputazione e visibilita' nella nicchia, molto meno per vendere coaching in
# Italia. Se l'obiettivo diventa acquisire clienti, tienili come secondari e
# lascia il grosso del budget follow alle sorgenti italiane.
#
# Per aggiungere altri big internazionali (Bumstead, Walker, Labrada, Ruffin,
# Queiroz...) verifica prima l'handle esatto aprendo instagram.com/USERNAME:
# non sono stati inseriti perche' non e' stato possibile confermarli.
blogger-followers: [johnjewett3, kuba_sylvester_cielen, andrea_mammoli, andrea.presti_ifbbpro, team_presti_coaching, lelerico_ifbbpro, mirco_fila, alex_ifbb_pro, andrea_muzilla_ifbbpro, marco_dambrosio_ifbbpro, manuel_santalucia_ifbbpro, albertomilani_ifbbpro, giulioalbi_ifbbpro, febo_gambacorta_ifbb_pro, ricky_ifbbpro, grumpy_grizzly_ifbbpro, legion_ifbbpro, anna.terzo_ifbb_pro, paola_wpd_ifbb_pro, zagarella_ifbb_pro, lorenzo.coppola_ifbbpro, dario_beloli_ifbbpro, gerard_ifbb_, punzetti_sara_ifbbpro, anna.ladurner.ifbbpro, ornella_angileri_ifbbpro, omarnonni_pnbapro, giusepperomanocoach, fabrizio_liparoti, valentinotozzi, gianzcoach, thehungrylonewolf, culturismoitaliano, italia.bodybuilding, ifbbproitaly, npc_italy, wnbfitaly, wbpf_italy, thenewclassic_s, bodybuilding_italia_community]

# blogger = commenta i post DI QUESTI ACCOUNT. Qui ci stanno anche gli esteri:
# un commento tecnico sotto al post di un top coach e' esattamente il posto
# dove un IFBB PRO italiano si fa notare dai pari.
blogger: [johnjewett3, kuba_sylvester_cielen, andrea_mammoli, andrea.presti_ifbbpro, lelerico_ifbbpro, mirco_fila, andrea_muzilla_ifbbpro, alex_ifbb_pro, manuel_santalucia_ifbbpro, marco_dambrosio_ifbbpro, culturismoitaliano, italia.bodybuilding]

# Sui profili grandi si fa SOLO il commento pubblico: niente like, niente
# follow, niente storie. Like/follow/sticker restano sui profili piccoli
# (i follower dei blogger), che sono il target che converte.
# Questo flag sospende anche i limiti di dimensione di filters.yml per il
# solo job `blogger`: con max_followers a 8000 un account da 300k verrebbe
# scartato e non commenteremmo nulla.
blogger-comment-only: true

# Ogni profilo toccato finisce in interacted_users.json e senza questo viene
# saltato PER SEMPRE ("already interacted ... Skip."). Sul job blogger vorrebbe
# dire commentare i competitor una volta sola e mai piu'. 168h = 7 giorni.
# NB: e' un parametro GLOBALE, vale anche per blogger-followers e hashtag; li'
# l'effetto e' pero' contenuto, perche' chi gia' segui viene escluso da
# skip_following e chi hai unfolloato da was_unfollowed_before.
can-reinteract-after: 168


# Hashtag verticali sul bodybuilding agonistico, misti IT/EN.
hashtag-likers-recent: [bodybuildingitalia, preparazioneagonistica, garebodybuilding, classicphysiqueitalia, menphysiqueitalia, ifbbitalia, ifbbpro, classicphysique, bodybuildingmotivation, prepcoach, offseasonbodybuilding, posingpractice, naturalbodybuildingitalia, massamuscolare, definizionemuscolare, ipertrofia]

hashtag-likers-top: [classicphysique, ifbbpro, bodybuildingitalia, preparazioneagonistica, classicphysiqueitalia, ifbbitalia, posingpractice, ipertrofia]

## Watching content
watch-video-time: 8-25
watch-photo-time: 2-5
delete-interacted-users: false
sort-followers-newest-to-oldest: true
unfollow-delay: 3
delete-removed-followers: false
telegram-reports: false

# ---------------------------------------------------------------------------
# Source Limits (per singola sorgente)
# ---------------------------------------------------------------------------
interactions-count: 10-15
likes-count: 2
likes-percentage: 85-95
carousel-count: 1-2
carousel-percentage: 50-70
max-comments-pro-user: 1
comment-percentage: 25-35
pm-percentage: 0
interact-percentage: 70-85
follow-percentage: 50-65
follow-limit: 5-8
skipped-list-limit: 30-45
skipped-posts-limit: 4
fling-when-skipped: 0
min-following: 50

# ---------------------------------------------------------------------------
# Total Limits Per Session (4 sessioni/giorno)
# ---------------------------------------------------------------------------
total-likes-limit: 20-25
total-follows-limit: 9-12
total-unfollows-limit: 0-0
total-watches-limit: 0-0
total-successful-interactions-limit: 9-12
total-interactions-limit: 999
total-comments-limit: 5-7
total-pm-limit: 0-0
total-scraped-limit: 200-300

# ---------------------------------------------------------------------------
# Daily Budget - separato da @rb.coach (file daily_budget.json per account)
# ---------------------------------------------------------------------------
daily-follows-cap: 50
daily-likes-cap: 110
daily-unfollows-cap: 50
daily-comments-cap: 30
daily-pm-cap: 0

## Watch-stories OFF: guardare le storie durante le interazioni non porta
## nulla e allunga la sessione. NB: e' diverso dal job answer-story-stickers,
## che apre le storie dei target apposta per rispondere ai box domande.
stories-count: 0
stories-percentage: 0

# ---------------------------------------------------------------------------
# Ending Session Conditions
# ---------------------------------------------------------------------------
end-if-likes-limit-reached: false
end-if-follows-limit-reached: false
end-if-watches-limit-reached: false
end-if-comments-limit-reached: false
end-if-pm-limit-reached: false

# ---------------------------------------------------------------------------
# AI Comments
#
# language "auto": lo Space scrive nella STESSA lingua della caption. Serve
# qui perche' le sorgenti sono miste: un commento in italiano sotto al post di
# John Jewett suonerebbe fuori posto, e viceversa.
# ---------------------------------------------------------------------------
ai-comments-enabled: true
ai-comments-space-url: https://mattysaints-instagram-bot.hf.space
# ai-comments-space-key: "sk_..."          # NON metterla qui: usa .env.local
ai-comments-language: auto
ai-comments-prompt-hint: "Chi commenta e' Roberto Buonomo, atleta IFBB PRO italiano di classic physique: pro card a 25 anni, campione italiano IFBB 2019 categoria -100kg e titolo assoluto, secondo all'Arnold Classic Barcelona 2019. Commenta da ATLETA, non da coach in cerca di clienti: e' uno del giro che parla con i suoi pari. Quando il post riguarda allenamento, gara, prep o posing puo' entrare nel merito tecnico (esecuzione, volume, periodizzazione, condizionamento, simmetria, timing della peak week) perche' quelle cose le fa davvero. IMPORTANTE: adatta il commento al CONTENUTO REALE della caption e non forzare il tema bodybuilding. Se parla di viaggio commenta il posto, se parla di cibo commenta il piatto, se e' un momento personale commenta con empatia. Cita SEMPRE un dettaglio concreto della caption (un numero, un esercizio, un luogo, un nome) cosi' si capisce che il post e' stato letto. Registro colloquiale e diretto, da pari a pari, mai formale e mai da venditore. MAI nominare coaching, schede, consulenze, FIT LAB, prezzi, link o DM. MAI emoji, hashtag o punti esclamativi. Una frase breve."
ai-comments-fallback-to-file: true

# ---------------------------------------------------------------------------
# Risposte agli sticker delle storie altrui (box domande)
#
# Il bot apre le storie di questi account e, se trova un box domande, risponde
# con una frase corta generata dallo Space ("cosa alleni oggi?" -> "petto").
# Il nome finisce nella casella risposte dell'autore, dove arrivano poche
# decine di messaggi invece delle migliaia di commenti sotto ai post.
#
# Due modalita', indipendenti:
#  1) sticker-check-percentage -> durante il flusso normale, per ogni
#     profilo candidato il bot apre anche le sue storie e, se trova un box
#     domande, risponde. E' la modalita' principale: colpisce i follower
#     dei blogger, cioe' il target vero.
#  2) answer-story-stickers   -> job dedicato che va sulle storie degli
#     account elencati qui sotto (i big). Serve a farsi notare da loro.
# Ogni risposta e' molto visibile, quindi i volumi restano bassi.
# ---------------------------------------------------------------------------
# answer-story-stickers: [...]   # DISATTIVATO: gli sticker si fanno solo sui
#   profili piccoli, dentro il flusso normale (sticker-check-percentage).
#   Riattivalo solo se vuoi rispondere anche ai box domande dei big.
sticker-check-percentage: 60-75            # su ~2 profili su 3 apre le storie per cercare un box domande

# sticker-replies-limit: 3-5                 # risposte per sessione
# stories-per-source-limit: 6                # storie da controllare per account
ai-sticker-enabled: true
ai-sticker-language: auto
ai-sticker-prompt-hint: "Chi risponde e' Roberto Buonomo, atleta IFBB PRO italiano. Risponde allo sticker da atleta a atleta: parola secca o due, niente presentazioni, niente complimenti, niente promozione."

# ---------------------------------------------------------------------------
# Scheduling - 4 sessioni/giorno (working-hours riscritta da run-dynamic.py)
# ---------------------------------------------------------------------------
working-hours: [10.00-11.30, 13.00-14.30, 17.00-18.30, 20.30-22.00]
time-delta: 0-15
total-sessions: 4
