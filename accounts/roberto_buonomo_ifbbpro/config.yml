## Watching content
watch-video-time: 8-25
watch-photo-time: 2-5
delete-interacted-users: false
sort-followers-newest-to-oldest: true
unfollow-delay: 3
delete-removed-followers: false
telegram-reports: false

# ---------------------------------------------------------------------------
# Source Limits (per singola sorgente)
# ---------------------------------------------------------------------------
# Abbassato da 10-15 il 24/08 sera, stesso motivo di rb.coach: tetto per
# sorgente piu' basso = 2-3 sorgenti per sessione invece di una sola lista
# scrollata in profondita'.
interactions-count: 8-12
likes-count: 1                             # 1 like per profilo: a parita' di budget like si ingaggia il DOPPIO dei profili, e con follow-only-if-engaged ogni profilo col like e' un candidato follow (24/08: like esauriti 109/110 con solo 24 follow su cap 50)
likes-percentage: 85-95
carousel-count: 1-2
carousel-percentage: 50-70
max-comments-pro-user: 1
comment-percentage: 25-35
pm-percentage: 0
interact-percentage: 70-85
# Roll alto di proposito: il gate anti-cold-follow e' gia' follow-only-if-engaged,
# e un secondo dado al 50-65% buttava via ~1 profilo ingaggiato su 2 a like gia'
# speso. Il tetto vero restano follow-limit per sorgente e daily-follows-cap.
follow-percentage: 85-95
follow-limit: 5-8
skipped-list-limit: 30-45
skipped-posts-limit: 4
fling-when-skipped: 0
min-following: 50

# ---------------------------------------------------------------------------
# Total Limits Per Session (4 sessioni/giorno)
# ---------------------------------------------------------------------------
# Con follow-only-if-engaged i like sono il carburante dei follow. Media 39 =
# daily-likes-cap 155 diviso le 4 finestre di config-alternato.yml; con
# likes-count: 1 ogni like e' un profilo ingaggiato (~39 candidati al follow
# per sessione).
#
# Taratura del 24/08. Riferimento: limiti orari "safe" per account
# consolidato (like 40-60/h, follow 20-30/h, commenti 8-12/h). Il ritmo
# MISURATO nei log del 23-24/08 stava a un terzo di quei numeri: picco reale
# 22 like/h e 6 follow/h. In una finestra da 75 minuti questi valori danno
# ~31 like/h e ~13 follow/h, sempre sotto meta' del consentito.
# Questo account ha 4 finestre invece di 5, quindi a parita' di limite per
# sessione il totale del giorno resta piu' basso di @rb.coach: e' voluto,
# sono due account con due strategie diverse.
total-likes-limit: 36-42
total-follows-limit: 15-18
total-unfollows-limit: 0-0
total-watches-limit: 0-0
# E' il limite che CHIUDE la sessione (bot_flow.py:432) e va diviso fra due
# job (blogger ne consuma ~5-7; un profilo = una interazione riuscita,
# session_state.py:66). Con likes-count: 1 ogni like e' un profilo riuscito:
# ~39 like + follow + commenti devono starci tutti. A chiudere la sessione
# pensano la finestra dei 75 min e end-if-likes-limit-reached; il tetto
# giornaliero vero resta daily-follows-cap/daily-likes-cap.
total-successful-interactions-limit: 38-46
total-interactions-limit: 999
total-comments-limit: 5-7
total-pm-limit: 0-0
total-scraped-limit: 200-300

# ---------------------------------------------------------------------------
# Daily Budget - separato da @rb.coach (file daily_budget.json per account)
# ---------------------------------------------------------------------------
# Tetti del 24/08, alzati sul misurato invece che sulla paura. Con 4 finestre
# da 75 min si sta a ~48 azioni/ora di picco: la soglia di rischio indicata
# per un account consolidato e' 60-80/ora, il pericolo vero oltre 100/ora.
# Sul giornaliero il margine e' ancora piu' largo: 155 like contro i 300-600
# considerati sicuri, 65 follow contro 150-200.
# Se arriva un action-block, il primo numero da riabbassare e' il PICCO
# ORARIO (total-likes-limit per finestra), non questi tetti.
daily-follows-cap: 65
daily-likes-cap: 155
daily-unfollows-cap: 50
daily-comments-cap: 30
daily-pm-cap: 0

## Watch-stories OFF: guardare le storie durante le interazioni non porta
## nulla e allunga la sessione. NB: e' diverso dal job answer-story-stickers,
## che apre le storie dei target apposta per rispondere ai box domande.
stories-count: 0
stories-percentage: 0

# ---------------------------------------------------------------------------
# Ending Session Conditions
# ---------------------------------------------------------------------------
# true: con follow-only-if-engaged, esaurito il budget like nessuna azione e'
# piu' possibile (engagement sempre 0). Il 24/08 dopo il like-limit il bot ha
# aperto 43 profili in ~25 min senza poter fare nulla: chiudere subito
# recupera quel tempo e toglie un pattern anomalo.
end-if-likes-limit-reached: true
end-if-follows-limit-reached: false
end-if-watches-limit-reached: false
end-if-comments-limit-reached: false
end-if-pm-limit-reached: false

# ---------------------------------------------------------------------------
# AI Comments
#
# language "auto": lo Space scrive nella STESSA lingua della caption. Serve
# qui perche' le sorgenti sono miste: un commento in italiano sotto al post di
# John Jewett suonerebbe fuori posto, e viceversa.
# ---------------------------------------------------------------------------
ai-comments-enabled: true
ai-comments-space-url: https://mattysaints-instagram-bot.hf.space
# ai-comments-space-key: "sk_..."          # NON metterla qui: usa .env.local
ai-comments-language: auto
ai-comments-prompt-hint: "Chi commenta e' Roberto Buonomo, atleta IFBB PRO italiano di classic physique: pro card a 25 anni, campione italiano IFBB 2019 categoria -100kg, secondo all'Arnold Classic Barcelona 2019. Il suo profilo racconta la vita da agonista: preparazione alle gare, cosa mangia in prep, allenamenti pesanti, peak week, posing, off-season. Commenta da ATLETA a ATLETA, mai da coach in cerca di clienti: e' uno che quelle cose le sta facendo davvero mentre scrive. Quando il post parla di allenamento, gara, dieta o condizione puo' entrare nel merito tecnico con naturalezza (esecuzione, volume e intensita', periodizzazione, scarico di sodio e acqua, simmetria, timing della peak week, gestione della fame in prep) perche' sono cose che vive in prima persona. IMPORTANTE: adatta il commento al CONTENUTO REALE della caption e non forzare il tema bodybuilding: se parla di viaggio commenta il posto, se di cibo il piatto, se e' un momento personale commenta con empatia. Cita SEMPRE un dettaglio concreto della caption (un numero, un esercizio, un luogo, un nome). Registro colloquiale e diretto, da pari a pari, mai formale e mai da venditore. MAI nominare coaching, schede, consulenze, FIT LAB, prezzi, link o DM. VARIA IL LESSICO: non usare in ogni commento le stesse parole chiave. In particolare NON aprire ne' costruire il commento attorno a parole come costanza, dedizione, disciplina, percorso, sacrificio: sono i tormentoni che rendono evidente che a scrivere e' sempre la stessa entita'. Trova ogni volta un angolo diverso, partendo dal dettaglio concreto del post. MAI emoji, hashtag o punti esclamativi. Una frase breve."
ai-comments-fallback-to-file: true

# ---------------------------------------------------------------------------
# Risposte agli sticker delle storie altrui (box domande)
#
# Il bot apre le storie di questi account e, se trova un box domande, risponde
# con una frase corta generata dallo Space ("cosa alleni oggi?" -> "petto").
# Il nome finisce nella casella risposte dell'autore, dove arrivano poche
# decine di messaggi invece delle migliaia di commenti sotto ai post.
#
# Due modalita', indipendenti:
#  1) sticker-check-percentage -> durante il flusso normale, per ogni
#     profilo candidato il bot apre anche le sue storie e, se trova un box
#     domande, risponde. E' la modalita' principale: colpisce i follower
#     dei blogger, cioe' il target vero.
#  2) answer-story-stickers   -> job dedicato che va sulle storie degli
#     account elencati qui sotto (i big). Serve a farsi notare da loro.
# Ogni risposta e' molto visibile, quindi i volumi restano bassi.
# ---------------------------------------------------------------------------
# answer-story-stickers: [...]   # DISATTIVATO: gli sticker si fanno solo sui
#   profili piccoli, dentro il flusso normale (sticker-check-percentage).
#   Riattivalo solo se vuoi rispondere anche ai box domande dei big.
# 0: il 22-24/08 il check non ha mai trovato un box domande su nessuno dei
# due account (~12-15 min/giorno per zero risposte). Prima di rialzarlo
# controlla nel log le righe "[sticker]": ora il bot scrive l'esito di ogni
# check, quindi si puo' riattivare a ragion veduta.
sticker-check-percentage: 0

# sticker-replies-limit: 3-5                 # risposte per sessione
# stories-per-source-limit: 6                # storie da controllare per account
ai-sticker-enabled: true
ai-sticker-language: auto
ai-sticker-prompt-hint: "Chi risponde e' Roberto Buonomo, atleta IFBB PRO italiano. Risponde allo sticker da atleta a atleta: parola secca o due, niente presentazioni, niente complimenti, niente promozione."

# ---------------------------------------------------------------------------
# Scheduling - 4 sessioni da 90 min (gap ~3.75h, jitter fino a +-35 min),
# con le working-hours RISCRITTE da run-dynamic.py a ogni lancio a partire
# dall'ora di avvio (dentro la fascia 08:00-23:00): si avvia il bot e la
# prima sessione parte subito. Con total-sessions: -1 e repeat, quegli orari
# si ripetono ogni giorno da soli. Quattro e non cinque: pause lunghe tra le
# finestre (~2-2.5h), come il profilo prudente 2025-26.
# Stesse finestre di rb.coach: i due account lavorano in simultanea. Per
# farli lavorare a turno c'e' config-alternato.yml.
# ---------------------------------------------------------------------------
working-hours: [20.34-22.04]   # generata dinamicamente da run-dynamic.py
time-delta: 0-0                             # ZERO di proposito: le finestre le calcola gia' run-dynamic.py dall'ora di lancio (con jitter fra una sessione e l'altra). Uno slittamento positivo qui sposterebbe in avanti la prima finestra e il bot, appena avviato, resterebbe fermo ad aspettare invece di partire subito
repeat: 1-5                                 # OBBLIGATORIO per avere piu' di una sessione: senza, GramAddict esce dopo la prima. Pausa minima, poi il bot aspetta la finestra successiva
total-sessions: -1                          # loop senza fine (rispetta le working-hours)
