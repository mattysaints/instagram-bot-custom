# ---------------------------------------------------------------------------
# AI Comments
#
# language "auto": lo Space scrive nella STESSA lingua della caption. Serve
# qui perche' le sorgenti sono miste: un commento in italiano sotto al post di
# John Jewett suonerebbe fuori posto, e viceversa.
# ---------------------------------------------------------------------------
ai-comments-enabled: true
ai-comments-space-url: https://mattysaints-instagram-bot.hf.space
# ai-comments-space-key: "sk_..."          # NON metterla qui: usa .env.local
ai-comments-language: auto
ai-comments-prompt-hint: "Chi commenta e' Roberto Buonomo, atleta IFBB PRO italiano di classic physique: pro card a 25 anni, campione italiano IFBB 2019 categoria -100kg, secondo all'Arnold Classic Barcelona 2019. Il suo profilo racconta la vita da agonista: preparazione alle gare, cosa mangia in prep, allenamenti pesanti, peak week, posing, off-season. Commenta da ATLETA a ATLETA, mai da coach in cerca di clienti: e' uno che quelle cose le sta facendo davvero mentre scrive. Quando il post parla di allenamento, gara, dieta o condizione puo' entrare nel merito tecnico con naturalezza (esecuzione, volume e intensita', periodizzazione, scarico di sodio e acqua, simmetria, timing della peak week, gestione della fame in prep) perche' sono cose che vive in prima persona. IMPORTANTE: adatta il commento al CONTENUTO REALE della caption e non forzare il tema bodybuilding: se parla di viaggio commenta il posto, se di cibo il piatto, se e' un momento personale commenta con empatia. Cita SEMPRE un dettaglio concreto della caption (un numero, un esercizio, un luogo, un nome). Registro colloquiale e diretto, da pari a pari, mai formale e mai da venditore. MAI nominare coaching, schede, consulenze, FIT LAB, prezzi, link o DM. VARIA IL LESSICO: non usare in ogni commento le stesse parole chiave. In particolare NON aprire ne' costruire il commento attorno a parole come costanza, dedizione, disciplina, percorso, sacrificio: sono i tormentoni che rendono evidente che a scrivere e' sempre la stessa entita'. Trova ogni volta un angolo diverso, partendo dal dettaglio concreto del post. MAI emoji, hashtag o punti esclamativi. Una frase breve."
ai-comments-fallback-to-file: true

# ---------------------------------------------------------------------------
# Risposte agli sticker delle storie altrui (box domande)
#
# Il bot apre le storie di questi account e, se trova un box domande, risponde
# con una frase corta generata dallo Space ("cosa alleni oggi?" -> "petto").
# Il nome finisce nella casella risposte dell'autore, dove arrivano poche
# decine di messaggi invece delle migliaia di commenti sotto ai post.
#
# Due modalita', indipendenti:
#  1) sticker-check-percentage -> durante il flusso normale, per ogni
#     profilo candidato il bot apre anche le sue storie e, se trova un box
#     domande, risponde. E' la modalita' principale: colpisce i follower
#     dei blogger, cioe' il target vero.
#  2) answer-story-stickers   -> job dedicato che va sulle storie degli
#     account elencati qui sotto (i big). Serve a farsi notare da loro.
# Ogni risposta e' molto visibile, quindi i volumi restano bassi.
# ---------------------------------------------------------------------------
# answer-story-stickers: [...]   # DISATTIVATO: gli sticker si fanno solo sui
#   profili piccoli, dentro il flusso normale (sticker-check-percentage).
#   Riattivalo solo se vuoi rispondere anche ai box domande dei big.
sticker-check-percentage: 60-75            # su ~2 profili su 3 apre le storie per cercare un box domande

# sticker-replies-limit: 3-5                 # risposte per sessione
# stories-per-source-limit: 6                # storie da controllare per account
ai-sticker-enabled: true
ai-sticker-language: auto
ai-sticker-prompt-hint: "Chi risponde e' Roberto Buonomo, atleta IFBB PRO italiano. Risponde allo sticker da atleta a atleta: parola secca o due, niente presentazioni, niente complimenti, niente promozione."

# ---------------------------------------------------------------------------
# Scheduling - 5 sessioni/giorno da 90 min in finestre FISSE dentro la fascia
# consentita 08:00-23:00. Sono le STESSE finestre di rb.coach: i due emulatori
# lavorano in simultanea (scelta del cliente). Con total-sessions: -1 il bot
# fa UNA sessione per finestra, poi aspetta la successiva; di notte dorme e
# riparte da solo la mattina dopo: nessun rilancio a mano. run-dynamic.py,
# vedendo -1, NON riscrive la riga.
# ---------------------------------------------------------------------------
working-hours: [09.50-11.05, 13.10-14.25, 16.30-17.45, 19.50-21.05]   # giornata alternata: mai in contemporanea con l'altro account
time-delta: 0-10   # slittamento +/- 10 min: resta dentro i 25 min di stacco fra i due account
repeat: 1-5                                 # OBBLIGATORIO per avere piu' di una sessione: senza, GramAddict esce dopo la prima. Pausa minima, poi il bot aspetta la finestra successiva
total-sessions: -1                          # loop senza fine (rispetta le working-hours)
