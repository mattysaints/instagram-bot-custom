##############################################################################
# Filtri - @roberto_buonomo_ifbbpro  (profilo personale, atleta IFBB PRO)
# Doc: https://docs.gramaddict.org/#/configuration?id=available-filters
# NB: per disattivare un filtro commentalo con #, non cancellarlo.
##############################################################################

##############################################################################
# OBIETTIVO DI QUESTO ACCOUNT: reputazione e autorevolezza dentro al
# bodybuilding agonistico, anche fuori dall'Italia. NON vendere coaching:
# per quello c'e' @rb.coach, con filtri suoi (../rb.coach/filters.yml).
#
# Qui il profilo che interessa e' l'opposto di quello di rb.coach: gente
# gia' dentro al giro - atleti, agonisti, addetti ai lavori - che se ti nota
# conta. Un profilo da 200 follower non porta reputazione; un preparatore da
# 15k si'.
#
# LA DIFFERENZA PIU' IMPORTANTE E' max_potency_ratio (vedi sotto): con il
# valore di rb.coach questo account scarterebbe esattamente le persone che
# deve raggiungere.
##############################################################################

## Filters on profile type
skip_if_private: true                      # non valutabile prima del follow: si scarta
skip_if_public: false
skip_business: false                       # qui i business/creator sono il target, non un problema
skip_non_business: false
skip_following: true
skip_follower: true
skip_if_link_in_bio: false                 # il link in bio e' la norma per atleti e coach
follow_private_or_empty: false

## Pre-flight username filters (valutati SENZA aprire il profilo)
skip_username_patterns:
  - "\\.shop$"
  - "_shop$"
  - "_store$"
  - "^crypto"
  - "^nft"
  - "^promo"
  - "^bot[_0-9]"
# NB: "_official$" NON e' escluso qui, a differenza di rb.coach: nel
# bodybuilding sono spesso federazioni, team e atleti veri.
skip_username_with_emoji: true
skip_username_longer_than: 30
skip_username_digit_ratio_above: 0.6

## Filters on profile stats - tarati su chi conta nella NICCHIA
min_followers: 800                         # sotto gli 800 l'interazione non porta visibilita' utile
max_followers: 30000                       # oltre i 30k sono i "big": li gestisce il job `blogger` a parte, con i suoi filtri sospesi
min_followings: 50
max_followings: 5000                       # piu' largo di rb.coach: gli atleti seguono molti colleghi
min_potency_ratio: 0.5

# *** IL VALORE CHIAVE DI QUESTO FILE ***
# potency_ratio = follower / seguiti (GramAddict/core/filter.py:424-430).
# Un atleta affermato ha 20.000 follower e 600 seguiti: ratio 33. Con il 4 di
# rb.coach verrebbe SCARTATO, e questo account passerebbe la vita a ingaggiare
# solo profili senza voce - cioe' il contrario del suo scopo.
max_potency_ratio: 40

min_posts: 15                              # piu' alto di rb.coach: chi e' dentro alla nicchia produce contenuti
mutual_friends: -1
last_post_max_age_days: 30                 # piu' stretto: qui interessa chi e' attivo ORA, non chi posta ogni due mesi

## Filters on biography and name
# Solo spam. A differenza di rb.coach NON si escludono coach e preparatori:
# qui sono esattamente le persone da raggiungere.
blacklist_words: [onlyfans, onlyf, escort, sex, "link in bio", telegram, vendita, sconto, codice sconto, spedizione, dropship, crypto, forex, casino, scommesse]
# mandatory_words: [...]                        # non attivato: costa una lettura bio in piu' per ogni profilo
# specific_alphabet: [LATIN]                    # disabilitato (costoso)
# biography_language: [it]                      # NON attivare: qui il pubblico e' anche estero

##############################################################################
# Filtri commenti
# Servono DUE flag a true insieme: comment_<media-type> + comment_<job-name>.
##############################################################################
comment_blogger_followers: true
comment_hashtag_likers_recent: true
comment_hashtag_likers_top: false
comment_hashtag_posts_top: false
comment_hashtag_posts_recent: false
comment_place_likers_top: false
comment_place_likers_recent: false
comment_place_posts_top: false
comment_place_posts_recent: false
comment_blogger_following: false
comment_blogger_post_likers: false
comment_blogger: true                      # commenta i post dei big (job `blogger`)
comment_interact_usernames: false
comment_interact_from_file: false
comment_feed: false
comment_photos: true
comment_videos: true
comment_carousels: true

## Filtri DM (non usati: DM disattivati su questo account)
pm_to_private_or_empty: false

## Filtri sul numero di likers del post (non usati dai job attivi)
min_likers: 1
max_likers: 1000
