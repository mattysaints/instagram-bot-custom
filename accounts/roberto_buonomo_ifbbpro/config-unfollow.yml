##############################################################################
# Config UNFOLLOW - @roberto_buonomo_ifbbpro
#
# Sgancia chi NON ha ricambiato il follow dopo N giorni. Sessioni separate dai
# follow: mescolare le due azioni nella stessa sessione e' uno dei pattern che
# IG riconosce piu' facilmente.
#
# Uso:
#   python run.py --config accounts/roberto_buonomo_ifbbpro/config-unfollow.yml
#
# Strategia consigliata: giorni dispari -> config.yml (follow+like),
# giorni pari -> questo file (solo unfollow).
##############################################################################

# ---------------------------------------------------------------------------
# General Configuration
# ---------------------------------------------------------------------------
username: roberto_buonomo_ifbbpro
device: emulator-5556                      # AVD robertobuo (deve combaciare con config.yml)
app-id: com.instagram.android
use-cloned-app: false
allow-untested-ig-version: true
screen-sleep: false
screen-record: false
speed-multiplier: 0.9
debug: false
close-apps: false
kill-atx-agent: false
restart-atx-agent: false
disable-block-detection: false
disable-filters: false
dont-type: true
total-crashes-limit: 3
count-app-crashes: false
shuffle-jobs: false
truncate-sources: 1-1

# ---------------------------------------------------------------------------
# AZIONE: solo unfollow-non-followers
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Throttle: qui NON si eredita niente da config.yml, ogni config e' a se'.
# Senza queste righe valgono i default del codice (unfollow 20-45s), cioe'
# 80-180 unfollow/ora: un burst, proprio sull'azione che le linee guida
# indicano come la piu' delicata (15-20/ora, "spargi su piu' ore, con
# intervalli irregolari"). Con 170-230s si sta a ~16-21/ora.
action-throttle-enabled: true
action-throttle-unfollow-min: 170-230
action-throttle-like-min: 10-22
action-throttle-follow-min: 30-70
action-throttle-comment-min: 300-420
action-throttle-pm-min: 999999

# Ridotto da 25-35: a 170-230s l'uno, 23 unfollow riempiono gia' ~80 minuti.
# Con total-sessions: 2 fanno ~46 al giorno, sotto daily-unfollows-cap 50.
unfollow-non-followers: 20-26

## Aspetta almeno N giorni dal follow prima di sganciare. Il conto parte da
## `last_interaction` in accounts/roberto_buonomo_ifbbpro/interacted_users.json,
## quindi il bot sgancia solo chi ha seguito lui: chi seguivi gia' prima non
## viene toccato. 2 giorni e' una scelta del cliente. Nota che accorciando la
## finestra il ciclo follow -> unfollow diventa piu' fitto, ed e' il pattern che
## Instagram riconosce piu' facilmente: se arrivano action-block, il primo
## numero da rialzare e' questo.
unfollow-delay: 2

## Dai piu' RECENTI ai piu' vecchi: su liste following grandi partire dai
## vecchi vuol dire scrollare per ore prima di arrivare ai candidati validi.
sort-followers-newest-to-oldest: true

## Invece di scrollare la lista Following alla cieca, prende i candidati da
## interacted_users.json e li cerca per username nella search bar. Molto piu'
## veloce su liste grandi ed evita i loop di scroll a vuoto.
unfollow-via-search: true

## Se scendi sotto questo numero di seguiti, il bot si ferma.
min-following: 100

# ---------------------------------------------------------------------------
# Source Limits (non rilevanti per unfollow, ma il loader li richiede)
# ---------------------------------------------------------------------------
interactions-count: 1-1
likes-count: 0
likes-percentage: 0
carousel-count: 0
carousel-percentage: 0
max-comments-pro-user: 0
interact-percentage: 0
follow-percentage: 0
follow-limit: 0
skipped-list-limit: 5
skipped-posts-limit: 1
fling-when-skipped: 0

# ---------------------------------------------------------------------------
# Total Limits Per Session - SOLO unfollow
# ---------------------------------------------------------------------------
total-likes-limit: 0-0
total-follows-limit: 0-0
total-unfollows-limit: 20-26
total-watches-limit: 0-0
total-successful-interactions-limit: 20-26
total-interactions-limit: 50-70            # include gli skip (follow_back / errori)
total-comments-limit: 0-0
total-pm-limit: 0-0
total-scraped-limit: 200-300               # NON 0: con 0 il bot esce subito

# ---------------------------------------------------------------------------
# Daily Budget (condiviso con config.yml)
# ---------------------------------------------------------------------------
daily-follows-cap: 50
daily-likes-cap: 110
daily-unfollows-cap: 50
daily-comments-cap: 30
daily-pm-cap: 0

stories-count: 0
stories-percentage: 0

# AI comments OFF: qui si sgancia soltanto.
ai-comments-enabled: false

# ---------------------------------------------------------------------------
# Ending Session Conditions
# ---------------------------------------------------------------------------
end-if-likes-limit-reached: false
end-if-follows-limit-reached: false
end-if-watches-limit-reached: false
end-if-comments-limit-reached: false
end-if-pm-limit-reached: false

# ---------------------------------------------------------------------------
# Scheduling: 2 sessioni/giorno distanziate 4-6h
# ---------------------------------------------------------------------------
time-delta: 0-1
repeat: 240-360
total-sessions: 2
