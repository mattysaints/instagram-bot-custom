# Controllo remoto del bot via Telegram.
# Copia questo file in telegram_control.yml (che e' gitignored) e compilalo.
#
# telegram-api-token -> https://t.me/botfather  (comando /newbot)
# telegram-chat-id   -> https://t.me/myidbot    (comando /getid)
#
# Solo il chat-id indicato qui puo' dare comandi al bot: chiunque altro
# viene ignorato e registrato nel log.

telegram-api-token: "your-api-token-here"
telegram-chat-id: "your-chat-id-here"

# /cmd esegue comandi sul mini PC da Telegram. Comodo, ma e' a tutti gli
# effetti una porta di esecuzione remota: chi entra nel tuo account Telegram
# si prende la macchina. Va acceso solo con un "true" esplicito.
#
# Per un terminale vero (interattivo, senza passare da Telegram) usa invece
# SSH: deploy\install-remote-shell.ps1
allow-shell: false
